services:
  tts-backend:
    image: synesthesiam/opentts:latest
    ports:
      - "5500:5500"  # OpenTTS HTTP API

  tts-server:
    build:
      context: ..
      dockerfile: docker/tts.Dockerfile
    env_file:
      - ../secret/.env  # 실제 실행 시 --env-file 로 덮어씀
    ports:
      - "5502:5502"
    depends_on:
      - tts-backend

  # Optional: single-origin reverse proxy for browser clients
  tts-proxy:
    image: nginx:alpine
    depends_on:
      - tts-server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro


