services:
  tts-backend:
    image: synesthesiam/opentts:latest
    ports:
      - "5500:5500"

    # ======================= 자동 다운로드 마운트 (START) =======================
    volumes:
      - voices:/data/local/voices:ro
    # ======================= 자동 다운로드 마운트 (END) =========================

    # ======================= 자동 다운로드 종속성 (START) =======================
    depends_on:
      voices-fetcher:
        condition: service_completed_successfully
    # ======================= 자동 다운로드 종속성 (END) =========================

  tts-server:
    build:
      context: ..
      dockerfile: docker/tts.Dockerfile
    env_file:
      - ../secret/.env
    ports:
      - "5502:5502"
    depends_on:
      - tts-backend

  tts-proxy:
    image: nginx:alpine
    depends_on:
      - tts-server
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # ======================= 자동 다운로드 서비스 (START) =======================
  voices-fetcher:
    image: curlimages/curl:8.10.1
    container_name: voices-fetcher
    user: root 
    environment:
      # neurlang/piper-onnx-kss-korean 저장소 사용
      VOICE_VERSION: "main"
      VOICE_ID: "piper-kss-korean"
      BASE_URL_RESOLVE: "https://huggingface.co/neurlang/piper-onnx-kss-korean/resolve"
      BASE_URL_RAW: "https://huggingface.co/neurlang/piper-onnx-kss-korean/raw"
    volumes:
      - voices:/voices
    command:
      - sh
      - -lc
      - |
        set -euo pipefail
        # NOTE: Compose variable substitution occurs before container start.
        # Escape with double-$ to defer expansion to container shell.
        [ -n "$$VOICE_ID" ] || { echo "VOICE_ID is required"; exit 1; }
        [ -n "$$VOICE_VERSION" ] || { echo "VOICE_VERSION is required"; exit 1; }
        [ -n "$$BASE_URL_RESOLVE" ] || { echo "BASE_URL_RESOLVE is required"; exit 1; }
        [ -n "$$BASE_URL_RAW" ] || { echo "BASE_URL_RAW is required"; exit 1; }

        echo "[voices-fetcher] env:"
        echo "  VOICE_ID=$$VOICE_ID"
        echo "  VOICE_VERSION=$$VOICE_VERSION"
        echo "  BASE_URL_RESOLVE=$$BASE_URL_RESOLVE"
        echo "  BASE_URL_RAW=$$BASE_URL_RAW"

        mkdir -p "/voices/$$VOICE_ID"
        cd "/voices/$$VOICE_ID"
        echo "[voices-fetcher] PWD=$(pwd)"

        ONNX_URL="$$BASE_URL_RESOLVE/$$VOICE_VERSION/$$VOICE_ID.onnx?download=true"
        JSON_URL="$$BASE_URL_RAW/$$VOICE_VERSION/$$VOICE_ID.onnx.json"
        echo "[voices-fetcher] ONNX_URL=$ONNX_URL"
        echo "[voices-fetcher] JSON_URL=$JSON_URL"

        curl -fL -o "$$VOICE_ID.onnx" "$ONNX_URL"
        curl -fL -o "$$VOICE_ID.onnx.json" "$JSON_URL"

        echo "[voices-fetcher] done"
    restart: "no"
  # ======================= 자동 다운로드 서비스 (END) =========================

volumes:
  voices:
